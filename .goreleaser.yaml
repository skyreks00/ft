# Release builds: scripts/release.sh vX.Y.Z (needs a GitHub token). The app
# UID and broker URL are the defaults in internal/config.
version: 2
project_name: ft

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - main: ./cmd/ft
    binary: ft
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/skyreks00/ft/internal/config.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
